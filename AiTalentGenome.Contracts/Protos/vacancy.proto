syntax = "proto3";

option csharp_namespace = "AiTalentGenome.Contracts.Vacancies";

package vacancy;

import "google/protobuf/timestamp.proto";

service VacancyService {
  // Синхронизация вакансий с HH для конкретного пользователя
  rpc SyncVacanciesWithHh (SyncVacanciesRequest) returns (SyncVacanciesResponse);

  // Получение списка вакансий из нашей БД
  rpc GetVacancies (GetVacanciesRequest) returns (GetVacanciesResponse);

  // Получение детальной информации (нужно для AI промпта)
  rpc GetVacancyById (GetVacancyByIdRequest) returns (VacancyResponse);
  rpc AddManualCandidate (AddManualCandidateRequest) returns (ApplicationResponse);
  rpc SyncApplications (SyncApplicationsRequest) returns (SyncApplicationsResponse);

  rpc CreateVacancyFromFile (UploadFileRequest) returns (VacancyResponse);
  rpc AddCandidateFromFile (UploadCandidateFileRequest) returns (ApplicationResponse);
}

message UploadFileRequest {
  bytes file_content = 1;
  string extension = 2;
}

message UploadCandidateFileRequest {
  string vacancy_id = 1;
  bytes file_content = 2;
  string extension = 3;
}

message SyncApplicationsRequest {
  string vacancy_id = 1;      // Наш внутренний Guid вакансии
  string access_token = 2;    // HH токен
}

message SyncApplicationsResponse {
  int32 synced_count = 1;
  string message = 2;
}

message AddManualCandidateRequest {
  string vacancy_id = 1;
  string candidate_name = 2;
  string candidate_email = 3;
  string candidate_phone = 4;
  string resume_url = 5;
  string cover_letter = 6;
}

message ApplicationResponse {
  string id = 1;
  string status = 2;
  string message = 3;
}

message SyncVacanciesRequest {
  string access_token = 1;
}

message SyncVacanciesResponse {
  int32 synced_count = 1;
  string message = 2;
}

message GetVacanciesRequest {
  bool only_active = 1;
}

message GetVacanciesResponse {
  repeated VacancyShort vacancies = 1;
}

message VacancyShort {
  string id = 1;
  string hh_id = 2;
  string title = 3;
  string employer_name = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetVacancyByIdRequest {
  string id = 1;
}

message VacancyResponse {
  string id = 1;
  string title = 2;
  string description = 3;
  repeated string key_skills = 4;
  Salary salary = 5;
  string experience = 6;
  string area_name = 7;
}

message Salary {
  int32 from = 1;
  int32 to = 2;
  string currency = 3;
}